# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
    pageTitle: Vai's Uni Notes
    pageTitleSuffix: ""
    enableSPA: true
    enablePopovers: true
    analytics:
        provider: plausible
    locale: en-US
    baseUrl: uni.vaisriv.com
    ignorePatterns:
        - private
        - templates
        - .obsidian
    theme:
        fontOrigin: googleFonts
        cdnCaching: true
        typography:
            header: Schibsted Grotesk
            body: Source Sans Pro
            code: IBM Plex Mono
        colors:
            lightMode:
                light: "#fffaf3"
                lightgray: "#f2e9de"
                gray: "#9893a5"
                darkgray: "#797593"
                dark: "#575279"
                secondary: "#907aa9"
                tertiary: "#56949f"
                highlight: rgba(144, 122, 169, 0.10)
                textHighlight: "#d7827e88"
            darkMode:
                light: "#1f1d2e"
                lightgray: "#26233a"
                gray: "#6e6a86"
                darkgray: "#b8b6c9"
                dark: "#e0def4"
                secondary: "#c4a7e7"
                tertiary: "#9ccfd8"
                highlight: rgba(196, 167, 231, 0.10)
                textHighlight: "#ebbcba88"
plugins:
    - source: "@quartz-community/created-modified-date"
      enabled: true
      options:
          defaultDateType: modified
          priority:
              - frontmatter
              - git
              - filesystem
      order: 10
    - source: "@quartz-community/syntax-highlighting"
      enabled: true
      options:
          theme:
              light: rose-pine-dawn
              dark: rose-pine
          keepBackground: false
      order: 20
    - source: "@quartz-community/obsidian-flavored-markdown"
      enabled: true
      options:
          enableInHtmlEmbed: false
          enableCheckbox: true
      order: 30
    - source: "@quartz-community/github-flavored-markdown"
      enabled: true
      order: 40
    - source: "@quartz-community/table-of-contents"
      enabled: true
      order: 50
      layout:
          position: right
          priority: 30
          display: desktop-only
    - source: "@quartz-community/crawl-links"
      enabled: true
      options:
          markdownLinkResolution: shortest
          prettyLinks: true
          openLinksInNewTab: false
          lazyLoad: true
          externalLinkIcon: true
      order: 60
    - source: "@quartz-community/description"
      enabled: true
      order: 70
    # vendored fork of @quartz-community/latex with KaTeX mhchem (\ce, \pu) enabled
    - source: ./plugins/latex
      enabled: true
      options:
          renderEngine: katex
          customMacros:
              # symbols
              "\\questeq": "\\stackrel{?}{=}"
              "\\st": "\\text{ s.t. }"
              "\\wrt": "\\text{ wrt. }"

              # vectors
              "\\crvector": "\\begin{bmatrix}#1\\end{bmatrix}"
              "\\vecb": "\\vec{\\bm{#1}}"

              # functions
              "\\func": "\\mathrm{\\,#1}"
              "\\fn": "\\mathrm{\\,#1}\\left(#2\\right)"

              # derivatives
              "\\drv": "\\frac{\\mathrm{d}#1}{\\mathrm{d}#2}"
              "\\ddrv": "\\frac{\\mathrm{d}^{2}#1}{\\mathrm{d}{#2}^{2}}"
              "\\deriv": "\\frac{\\mathrm{d}}{\\mathrm{d}#1}\\left(#2\\right)"
              "\\dderiv": "\\frac{\\mathrm{d}^{2}}{\\mathrm{d}{#1}^{2}}\\left(#2\\right)"

              # partial derivatives
              "\\pdrv": "\\frac{\\partial#1}{\\partial#2}"
              "\\pddrv": "\\frac{\\partial^{2}#1}{\\partial{#2}^{2}}"
              "\\pderiv": "\\frac{\\partial}{\\partial#1}\\left(#2\\right)"
              "\\pdderiv": "\\frac{\\partial^{2}}{\\partial{}{#1}^{2}}\\left(#2\\right)"

              # probability
              "\\E": "\\mathrm{\\,E}\\left(#1\\right)"
              "\\Var": "\\mathrm{\\,Var}\\left(#1\\right)"
              "\\Cov": "\\mathrm{\\,Cov}\\left(#1\\right)"
              "\\Bias": "\\mathrm{\\,Bias}\\left(#1\\right)"
              "\\Prob": "\\mathrm{\\,Pr}\\left(#1\\right)"

              # trig
              "\\sin": "\\mathrm{\\,sin}\\left(#1\\right)"
              "\\cos": "\\mathrm{\\,cos}\\left(#1\\right)"
              "\\tan": "\\mathrm{\\,tan}\\left(#1\\right)"
              "\\csc": "\\mathrm{\\,csc}\\left(#1\\right)"
              "\\sec": "\\mathrm{\\,sec}\\left(#1\\right)"
              "\\cot": "\\mathrm{\\,cot}\\left(#1\\right)"
              "\\sinh": "\\mathrm{\\,sinh}\\left(#1\\right)"
              "\\cosh": "\\mathrm{\\,cosh}\\left(#1\\right)"
              "\\tanh": "\\mathrm{\\,tanh}\\left(#1\\right)"
              "\\coth": "\\mathrm{\\,coth}\\left(#1\\right)"
              "\\arcsin": "\\mathrm{\\,arcsin}\\left(#1\\right)"
              "\\arccos": "\\mathrm{\\,arccos}\\left(#1\\right)"
              "\\arctan": "\\mathrm{\\,arctan}\\left(#1\\right)"

              # log, ln, etc
              "\\log": "\\mathrm{\\,log}\\left(#1\\right)"
              "\\ln": "\\mathrm{\\,ln}\\left(#1\\right)"

              # num sets
              "\\Re": "\\mathfrak{\\,Re}\\left{#1\\right}"
              "\\Im": "\\mathfrak{\\,Im}\\left{#1\\right}"

              # laplace
              "\\laplace": "\\mathscr{\\,L}\\left{#1\\right}"
              "\\ilaplace": "\\mathscr{\\,L}^{-1}\\left{#1\\right}"

              # integrals
              "\\inti": "\\int #1 \\mathrm{\\,d}#2"
              "\\intd": "\\int_{#1}^{#2} #3 \\mathrm{\\,d}#4"
      order: 80
    - source: "@quartz-community/citations"
      enabled: false
      order: 85
    - source: "@quartz-community/hard-line-breaks"
      enabled: false
      order: 90
    - source: "@quartz-community/ox-hugo"
      enabled: false
      order: 91
    - source: "@quartz-community/roam"
      enabled: false
      order: 92
    - source: "@quartz-community/quartz-fonts"
      enabled: true
    - source: "@quartz-themes/core"
      enabled: false
      options:
          theme: tokyo-night
          mode: both
    - source: "@quartz-community/remove-draft"
      enabled: true
    - source: "@quartz-community/explicit-publish"
      enabled: false
    - source: "@quartz-community/unlisted-pages"
      enabled: true
      options: {}
      order: 45
    - source: "@quartz-community/encrypted-pages"
      enabled: true
      options:
          iterations: 600000
          passwordField: password
          unlistWhenEncrypted: false
          outputPath: static/encryptedContentIndex.json
    - source: "@quartz-community/stacked-pages"
      enabled: false
      layout:
          position: afterBody
          priority: 50
          display: all
    - source: "@quartz-community/alias-redirects"
      enabled: true
    - source: "@quartz-community/content-index"
      enabled: true
      options:
          enableSiteMap: true
          enableRSS: true
    - source: "@quartz-community/favicon"
      enabled: true
    - source: "@quartz-community/og-image"
      enabled: true
    - source: "@quartz-community/cname"
      enabled: true
    - source: "@quartz-community/canvas-page"
      enabled: true
    - source: "@quartz-community/content-page"
      enabled: true
    - source: "@quartz-community/folder-page"
      enabled: true
    - source: "@quartz-community/tag-page"
      enabled: true
    - source: "@quartz-community/explorer"
      enabled: true
      layout:
          position: left
          priority: 50
    - source: "@quartz-community/graph"
      enabled: true
      layout:
          position: right
          priority: 10
    - source: "@quartz-community/search"
      enabled: true
      layout:
          position: left
          priority: 20
          group: toolbar
          groupOptions:
              grow: true
    - source: "@quartz-community/backlinks"
      enabled: true
      layout:
          position: right
          priority: 50
    - source: "@quartz-community/article-title"
      enabled: true
      layout:
          position: beforeBody
          priority: 10
    - source: "@quartz-community/content-meta"
      enabled: true
      layout:
          position: beforeBody
          priority: 20
    - source: "@quartz-community/tag-list"
      enabled: true
      layout:
          position: beforeBody
          priority: 30
    - source: "@quartz-community/page-title"
      enabled: true
      layout:
          position: left
          priority: 10
    - source: "@quartz-community/darkmode"
      enabled: true
      layout:
          position: left
          priority: 30
          group: toolbar
    - source: "@quartz-community/reader-mode"
      enabled: true
      layout:
          position: left
          priority: 35
          group: toolbar
    - source: "@quartz-community/breadcrumbs"
      enabled: true
      layout:
          position: beforeBody
          priority: 5
          condition: not-index
    - source: "@quartz-community/comments"
      enabled: false
      options:
          provider: giscus
          options: {}
      layout:
          position: afterBody
          priority: 10
    - source: "@quartz-community/footer"
      enabled: true
      options:
          links:
              GitHub: https://github.com/jackyzha0/quartz
              Discord Community: https://discord.gg/cRFFHYye7t
      layout:
          position: footer
          priority: 50
    - source: "@quartz-community/recent-notes"
      enabled: false
    - source: "@quartz-community/spacer"
      enabled: true
      options: {}
      order: 25
      layout:
          position: left
          priority: 25
          display: mobile-only
    - source: "@quartz-community/bases-page"
      enabled: true
      options: {}
      order: 50
    - source: "@quartz-community/note-properties"
      enabled: true
      options:
          includeAll: false
          includedProperties:
              - description
              - tags
              - aliases
          excludedProperties: []
          hidePropertiesView: true
          delimiters: ---
          language: yaml
      order: 5
      layout:
          position: beforeBody
          priority: 15
          display: all
layout:
    groups:
        toolbar:
            priority: 35
            direction: row
            gap: 0.5rem
    byPageType:
        "404":
            positions:
                beforeBody: []
                left: []
                right: []
        content: {}
        folder:
            exclude:
                - reader-mode
            positions:
                right: []
        tag:
            exclude:
                - reader-mode
            positions:
                right: []
        canvas: {}
        bases: {}
